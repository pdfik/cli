name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Container image for the same tag, from the repository Dockerfile (the build
  # stage cross-compiles for both platforms, so nothing runs under QEMU). Runs
  # only after the GitHub Release exists: a tag whose tests fail in goreleaser's
  # before-hooks must not leave an image behind. Tags: 0.1.1, 0.1 and latest;
  # a pre-release (v0.2.0-rc1) gets its exact tag only. The package is created
  # PRIVATE on the first push — make it public once in the GHCR package settings.
  docker:
    name: container image
    runs-on: ubuntu-latest
    needs: [goreleaser]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/pdfik/cli
    steps:
      - uses: actions/checkout@v7
      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tags="${IMAGE}:${version}"
          case "$version" in
            *-*) ;;
            *) tags="${tags},${IMAGE}:${version%.*},${IMAGE}:latest" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Keep the manifest list to the two real platforms (no attestation
          # entries shown as unknown/unknown); checksums.txt stays the
          # verification surface, as for the binaries.
          provenance: false
